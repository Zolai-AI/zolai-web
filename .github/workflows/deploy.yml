name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.BETTER_AUTH_URL }}

      - name: Sync to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "./"
          target: "/path/to/zolai/nextjs-app"
          rm: false
          exclude: ".git,node_modules,.env*,tests,playwright-report,docs,.next/cache"

      - name: Install deps & restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ubuntu
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /path/to/zolai/nextjs-app
            /path/to/zolai/.bun/bin/bun install --production --frozen-lockfile
            /path/to/zolai/.bun/bin/bunx prisma migrate deploy
            sudo systemctl restart zolai-next
            sleep 3
            systemctl is-active zolai-next

      - name: Health check
        env:
          APP_HEALTH_URL: ${{ secrets.APP_HEALTH_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          sleep 10
          # Prefer explicit Next app URL; zolai.space is landing (Workers), not /api/cron/*
          if [ -n "${APP_HEALTH_URL:-}" ]; then
            SEP='?'
            case "$APP_HEALTH_URL" in *\?*) SEP='&' ;; esac
            HURL="$APP_HEALTH_URL"
            [ -n "${CRON_SECRET:-}" ] && HURL="${APP_HEALTH_URL}${SEP}secret=${CRON_SECRET}"
            curl -fsS --max-time 30 "$HURL" || exit 1
          else
            # Landing edge: 200 OK or Cloudflare bot challenge (403) counts as reachable
            BODY=$(mktemp)
            STATUS=$(curl -s -o "$BODY" -w "%{http_code}" --max-time 30 -L https://zolai.space/ || echo "000")
            if [ "$STATUS" = "200" ]; then exit 0; fi
            if [ "$STATUS" = "403" ] && grep -qi "Just a moment\|cf-mitigated\|challenge" "$BODY"; then
              echo "Landing edge reachable (CF challenge)"; exit 0
            fi
            echo "Health check failed status=$STATUS"; exit 1
          fi

      - name: Notify Telegram on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="❌ Zolai deploy FAILED on commit ${{ github.sha }} by ${{ github.actor }}"
